name: Release Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use vMAJOR.MINOR.PATCH'; exit 1; }
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          printf '0877a1d048fe4a24efe2eff536ca4223f7adeb58648bb81909d33c446918cfa8  %s\n' "$RUNNER_TEMP/android-tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-36' 'build-tools;36.0.0' > "$RUNNER_TEMP/sdk-install.log" 2>&1 || { cat "$RUNNER_TEMP/sdk-install.log"; exit 1; }
      - name: Test, lint, and build unsigned release with verified dependencies
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon --dependency-verification=strict testDebugUnitTest lintRelease assembleRelease bundleRelease \
            -PunsignedRelease=true -PreleaseVersion="${RELEASE_TAG#v}" -PreleaseVersionCode="$RELEASE_VERSION_CODE"
      - name: Prepare unsigned artifacts
        shell: bash
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/release/app-release-unsigned.apk
          if "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify "$apk" >/dev/null 2>&1; then
            echo 'Build job must produce an unsigned APK'; exit 1
          fi
          unzip -Z1 app/build/outputs/bundle/release/app-release.aab > "$RUNNER_TEMP/bundle-entries.txt"
          if grep -Ei '^META-INF/[^/]+\.(SF|RSA|DSA|EC)$' "$RUNNER_TEMP/bundle-entries.txt" >/dev/null; then
            echo 'Build job must produce an unsigned AAB'; exit 1
          fi
          mkdir unsigned
          cp "$apk" "unsigned/galenacast-$RELEASE_TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab "unsigned/galenacast-$RELEASE_TAG.aab"
          cp app/build/outputs/mapping/release/mapping.txt "unsigned/mapping-$RELEASE_TAG.txt"
          cp docs/release-notes.md unsigned/release-notes.md
          (cd unsigned && sha256sum *.apk *.aab *.txt *.md > SHA256SUMS)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: unsigned-release
          path: unsigned/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
    # No checkout, Gradle, tests, or shared build cache in the signing job.
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: unsigned-release
          path: unsigned
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Install verified signing tools
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --retry 2 https://dl.google.com/android/repository/build-tools_r36_linux.zip -o "$RUNNER_TEMP/build-tools.zip"
          printf '5d9ac77fb6ff43d9da518a337b4fcf8f9097113df531d99ccefe80ef7ce8250b  %s\n' "$RUNNER_TEMP/build-tools.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/build-tools.zip" -d "$RUNNER_TEMP/signing-tools"
      - name: Sign and verify release artifacts
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || exit 1
          (cd unsigned && sha256sum --check --status SHA256SUMS)
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing Actions secret: $name"; exit 1; }
          done
          umask 077
          signing_file="$RUNNER_TEMP/release.jks"
          trap 'rm -f "$signing_file"' EXIT
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$signing_file"
          unset ANDROID_KEYSTORE_BASE64
          # Public certificate digest of the existing application; prevents an accidental key change.
          expected_signer=62c72ddf6c8ba13db3be4c333b5c15027a849c34d04b29d147d5cb07f67cd435
          signer=$(keytool -exportcert -keystore "$signing_file" -storepass:env ANDROID_KEYSTORE_PASSWORD -alias podcast-release | sha256sum | cut -d ' ' -f1)
          [[ "$signer" == "$expected_signer" ]] || { echo 'Signing certificate does not match previous releases'; exit 1; }
          signing_tools="$RUNNER_TEMP/signing-tools/android-16"
          mkdir dist
          "$signing_tools/apksigner" sign --ks "$signing_file" --ks-key-alias podcast-release --v4-signing-enabled false \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD --key-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "dist/galenacast-$RELEASE_TAG.apk" "unsigned/galenacast-$RELEASE_TAG.apk"
          jarsigner -keystore "$signing_file" -storepass:env ANDROID_KEYSTORE_PASSWORD -keypass:env ANDROID_KEYSTORE_PASSWORD \
            -sigalg SHA256withRSA -digestalg SHA-256 -signedjar "dist/galenacast-$RELEASE_TAG.aab" \
            "unsigned/galenacast-$RELEASE_TAG.aab" podcast-release
          unset ANDROID_KEYSTORE_PASSWORD
          "$signing_tools/apksigner" verify --verbose "dist/galenacast-$RELEASE_TAG.apk"
          jarsigner -verify "dist/galenacast-$RELEASE_TAG.aab"
          cp "unsigned/mapping-$RELEASE_TAG.txt" dist/
          (cd dist && sha256sum *.apk *.aab *.txt > SHA256SUMS)
      - name: Publish normal release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "GalenaCast $RELEASE_TAG" --notes-file unsigned/release-notes.md
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/release.jks"
