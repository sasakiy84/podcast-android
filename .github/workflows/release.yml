name: Release Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      RELEASE_VERSION_CODE: ${{ github.run_number }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Validate tag and signing credentials
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Use vMAJOR.MINOR.PATCH'; exit 1; }
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD; do
            [[ -n "${!name}" ]] || { echo "Missing Actions secret: $name"; exit 1; }
          done
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/release.jks"
          printf 'ANDROID_KEYSTORE_PATH=%s\n' "$ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          umask 077
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
      - name: Install pinned Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          export ANDROID_HOME="$RUNNER_TEMP/android-sdk"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$ANDROID_HOME" "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          mkdir -p "$ANDROID_HOME/cmdline-tools"
          curl -fsSL --retry 2 https://dl.google.com/android/repository/commandlinetools-linux-16111833_latest.zip -o "$RUNNER_TEMP/android-tools.zip"
          printf 'e025545c62a8e64c7559119566a569fb1dec5f60  %s\n' "$RUNNER_TEMP/android-tools.zip" | sha1sum --check
          unzip -q "$RUNNER_TEMP/android-tools.zip" -d "$ANDROID_HOME/cmdline-tools"
          mv "$ANDROID_HOME/cmdline-tools/cmdline-tools" "$ANDROID_HOME/cmdline-tools/latest"
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$ANDROID_HOME" \
            'platforms;android-36' 'build-tools;36.0.0' > "$RUNNER_TEMP/sdk-install.log" 2>&1 || { cat "$RUNNER_TEMP/sdk-install.log"; exit 1; }
      - name: Test, lint, and build signed release
        shell: bash
        run: |
          set -euo pipefail
          ./gradlew --no-daemon testDebugUnitTest lintRelease assembleRelease bundleRelease \
            -PreleaseVersion="${RELEASE_TAG#v}" -PreleaseVersionCode="$RELEASE_VERSION_CODE"
      - name: Verify signatures and prepare assets
        shell: bash
        run: |
          set -euo pipefail
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose app/build/outputs/apk/release/app-release.apk
          jarsigner -verify app/build/outputs/bundle/release/app-release.aab
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/galenacast-$RELEASE_TAG.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/galenacast-$RELEASE_TAG.aab"
          cp app/build/outputs/mapping/release/mapping.txt "dist/mapping-$RELEASE_TAG.txt"
          (cd dist && sha256sum *.apk *.aab *.txt > SHA256SUMS)
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          gh release create "$RELEASE_TAG" dist/* --verify-tag \
            --title "GalenaCast $RELEASE_TAG" --notes-file docs/release-notes.md
      - name: Remove signing material
        if: always()
        shell: bash
        run: rm -f "$ANDROID_KEYSTORE_PATH"
